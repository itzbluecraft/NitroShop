# Simbol mata uang
currency-symbol: "$"

# Harga per 1 item (dikali jumlah di slot). Item yang tidak ada di daftar memakai default-price.
default-price: 100

# Tambahan harga untuk tiap level enchant (per item). Contoh: Sharpness V = 5 level x ini.
enchant-price-per-level: 500

# Awalan command di dalam dialog (run_command). Kalau tombol dialog tidak jalan,
# coba ganti jadi "" (kosong).
dialog-command-prefix: "/"

